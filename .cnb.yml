main:
  push:
    - imports: https://cnb.cool/miaoduck/KeyBase/-/blob/main/envs.yml
      stages:
        - name: Build Hugo Site
          image: ubuntu:latest
          script: |
            apt-get update && apt-get install -y curl
            bash build.sh

        - name: Deploy to EdgeOne Makers
          image: node:20
          script: |
            npx edgeone makers deploy ./public \
              -n blog-ducktech \
              -e production \
              -t "$EDGEONE_API_TOKEN"

        - name: Push to GitHub
          image: ubuntu:latest
          script: |
            set -e

            # 安装 git
            apt-get update && apt-get install -y git

            # Git 全局配置
            git config --global user.name "CNB Bot"
            git config --global user.email "bot@cnb.cool"

            # 1️⃣ 克隆 CNB 仓库（源仓库）
            git clone https://cnb.cool/miaoduck/Boke cnb-repo
            cd cnb-repo

            # 2️⃣ 克隆 GitHub 仓库（目标仓库）
            cd ..
            git clone https://$GITHUB_KEY@github.com/MiaoDuck/Blog github-repo
            cd github-repo

            # 3️⃣ 同步内容
            rm -rf *
            cp -r ../cnb-repo/* .

            # 4️⃣ 提交并推送
            git add .
            git commit -m "Deploy: $(date +%F_%T)" || echo "No changes to commit"
            git push origin main