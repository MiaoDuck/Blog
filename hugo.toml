# 站点基础配置
baseURL = "https://blog.mkka27834.workers.dev/"
defaultContentLanguage = "zh-cn"
title = "技术笔记"
theme = "hextra"
enableRobotsTXT = true
enableEmoji = true
hasCJKLanguage = true
buildDrafts = false
enableInlineShortcodes = true

# Markdown 渲染
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false

# 输出格式
[outputs]
  home = ["HTML", "RSS"]

# 顶部导航菜单
[[menu.main]]
  identifier = "docs"
  name = "知识库"
  pageRef = "/docs"
  weight = 1

[[menu.main]]
  identifier = "blog"
  name = "博客"
  pageRef = "/blog"
  weight = 2

[[menu.main]]
  name = "搜索"
  weight = 3
  [menu.main.params]
    type = "search"

[[menu.main]]
  name = "GitHub"
  weight = 4
  url = "https://github.com/MiaoDuck/Blog"
  [menu.main.params]
    icon = "github"

# 主题参数
[params]
  description = "记录与分享后端、架构与基础设施的学习笔记"

  # 顶部导航栏
  [params.navbar]
    displayTitle = true
    displayLogo = false
    width = "wide"

  # 主题切换
  [params.theme]
    default = "system"
    displayToggle = true

  # 页脚
  [params.footer]
    enable = true
    displayCopyright = true
    displayPoweredBy = false
    width = "normal"

  # 搜索
  [params.search]
    enable = true
    type = "flexsearch"
    [params.search.flexsearch]
      index = "content"
      tokenize = "forward"

  # 博客列表配置
  [params.blog]
    [params.blog.list]
      displayTags = true
      sortBy = "date"
      sortOrder = "desc"
      pagerSize = 20
    [params.blog.article]
      displayPagination = true

  # 代码复制
  [params.highlight]
    [params.highlight.copy]
      enable = true
      display = "hover"

  # 页面宽度
  [params.page]
    width = "normal"

  # 目录显示标签
  [params.toc]
    displayTags = true

  # 图片缩放
  [params.imageZoom]
    enable = true

  # 评论（默认关闭）
  [params.comments]
    enable = false
